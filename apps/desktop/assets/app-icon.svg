<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Windows/Linux variant: full-bleed rounded tile.
       Colors are the app's own accent gradient (--accent -> --accent-2 in
       apps/frontend/src/index.css) and the glyph is the same bolt as
       apps/frontend/public/favicon.svg, so the desktop icon, the taskbar
       and the app window's tab icon all read as one thing. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="glyphShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2e1065" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#tile)"/>
  <g filter="url(#glyphShadow)">
    <g transform="translate(261.6 272) scale(10.435)">
      <path fill="#ffffff" d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z"/>
    </g>
  </g>
</svg>
